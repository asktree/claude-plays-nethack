[project]
name = "claude-plays-nethack"
version = "0.0.1"
description = "Claude plays NetHack via an MCP server over NLE."
requires-python = ">=3.12"
dependencies = [
    "nle>=1.3.0",
    "fastmcp>=2.0",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
